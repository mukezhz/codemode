syntax = "proto3";

package todo.v1;

import "codemode.proto";

option go_package = "github.com/mukezhz/codemode/examples/todo/gen/todo/v1;todov1";

service TodoService {
  option (codemode.namespace) = "todos";

  rpc Create(CreateTodoRequest) returns (CreateTodoResponse) {
    option (codemode.description) = "Creates a todo item with the given title.";
  }

  rpc List(ListTodosRequest) returns (ListTodosResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (codemode.description) = "Lists all todo items and their completion state.";
  }

  rpc Complete(CompleteTodoRequest) returns (CompleteTodoResponse) {
    option (codemode.description) = "Marks a todo item as completed by ID.";
  }

  rpc Delete(DeleteTodoRequest) returns (DeleteTodoResponse) {
    option (codemode.description) = "Deletes a todo item by ID. The user approves each deletion before it happens.";
    option (codemode.needs_approval) = true;
  }
}

message CreateTodoRequest {
  string title = 1;
}

message CreateTodoResponse {
  Todo todo = 1;
}

message ListTodosRequest {}

message ListTodosResponse {
  repeated Todo todos = 1;
}

message CompleteTodoRequest {
  int64 id = 1;
}

message CompleteTodoResponse {
  Todo todo = 1;
}

message Todo {
  int64 id = 1;
  string title = 2;
  bool completed = 3;
}

message DeleteTodoRequest {
  int64 id = 1;
}

message DeleteTodoResponse {
  bool deleted = 1;
}

version: v2
# One module per owner. codemode.proto belongs to the library; everything else
# belongs to the example or the test that uses it, and lives beside it.
#
# Buf resolves imports across modules in the workspace, so an example's proto
# can import codemode.proto without vendoring a copy — which is exactly what a
# consuming repository cannot do, and why codemode-registry -print-proto exists.
modules:
  - path: proto
  - path: examples/taskreport/proto
  - path: examples/todo/proto
  - path: registry/internal/fixturepb/proto
lint:
  use:
    - STANDARD
  except:
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # Capability schemas end up in the model's prompt. Two RPCs that return the
    # same shape should say so with one type name rather than two identical
    # ones, because every extra name is prompt the model has to reconcile.
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    PACKAGE_VERSION_SUFFIX:
      - proto/codemode.proto
breaking:
  use:
    - FILE

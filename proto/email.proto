syntax = "proto3";

package email.v1;

import "codemode.proto";

option go_package = "github.com/mukezhz/codemode/gen/email/v1;emailv1";

service EmailService {
  option (codemode.namespace) = "email";

  rpc Send(SendEmailRequest) returns (SendEmailResponse) {
    option (codemode.description) = "Sends an email to the specified recipient.";
  }
}

message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
}

message SendEmailResponse {
  bool success = 1;
}

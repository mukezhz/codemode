syntax = "proto3";

package email.v1;

import "code_mode.proto";

option go_package = "github.com/mukezhz/code-mode/gen/email/v1;emailv1";

service EmailService {
  option (code_mode.namespace) = "email";

  rpc Send(SendEmailRequest) returns (SendEmailResponse) {
    option (code_mode.description) = "Sends an email to the specified recipient.";
  }
}

message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
}

message SendEmailResponse {
  bool success = 1;
}

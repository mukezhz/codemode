syntax = "proto3";

package email.v1;

option go_package = "github.com/mycompany/code-mode/gen/email/v1;emailv1";

// code-mode:namespace=email
service EmailService {
  // Sends an email to the specified recipient.
  rpc Send(SendEmailRequest) returns (SendEmailResponse);
}

message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
}

message SendEmailResponse {
  bool success = 1;
}

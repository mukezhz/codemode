syntax = "proto3";

package invoice.v1;

import "codemode.proto";

option go_package = "github.com/mukezhz/codemode/gen/invoice/v1;invoicev1";

service InvoiceService {
  option (codemode.namespace) = "invoices";

  rpc ListUnpaid(ListUnpaidRequest) returns (ListUnpaidResponse) {
    option (codemode.description) = "Returns all unpaid invoices.";
  }

  rpc Create(CreateInvoiceRequest) returns (CreateInvoiceResponse) {
    option (codemode.description) = "Creates an invoice for an order.";
  }
}

message ListUnpaidRequest {}

message ListUnpaidResponse {
  repeated Invoice invoices = 1;
}

message CreateInvoiceRequest {
  string order_id = 1;
}

message CreateInvoiceResponse {
  Invoice invoice = 1;
}

message Invoice {
  string id = 1;
  string customer_id = 2;
  double amount = 3;
  string status = 4;
}

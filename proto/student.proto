syntax = "proto3";

package student.v1;

option go_package = "github.com/mycompany/code-mode/gen/student/v1;studentv1";

// code-mode:namespace=students
service StudentService {
  // Returns students whose visa interview occurs within the specified number of days.
  rpc InterviewsWithin(InterviewsWithinRequest) returns (InterviewsWithinResponse);

  // Sends a reminder to a student.
  rpc SendReminder(SendReminderRequest) returns (SendReminderResponse);
}

message InterviewsWithinRequest {
  int32 days = 1;
}

message InterviewsWithinResponse {
  repeated Student students = 1;
}

message SendReminderRequest {
  string student_id = 1;
}

message SendReminderResponse {
  bool success = 1;
}

message Student {
  string id = 1;
  string name = 2;
  string email = 3;
  string interview_date = 4;
}

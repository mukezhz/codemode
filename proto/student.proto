syntax = "proto3";

package student.v1;

import "code_mode.proto";

option go_package = "github.com/mukezhz/code-mode/gen/student/v1;studentv1";

service StudentService {
  option (code_mode.namespace) = "students";

  rpc InterviewsWithin(InterviewsWithinRequest) returns (InterviewsWithinResponse) {
    option (code_mode.description) = "Returns students whose visa interview occurs within N days.";
  }

  rpc SendReminder(SendReminderRequest) returns (SendReminderResponse) {
    option (code_mode.description) = "Sends a reminder to a student.";
  }
}

message InterviewsWithinRequest {
  int32 days = 1;
}

message InterviewsWithinResponse {
  repeated Student students = 1;
}

message SendReminderRequest {
  string student_id = 1;
}

message SendReminderResponse {
  bool success = 1;
}

message Student {
  string id = 1;
  string name = 2;
  string email = 3;
  string interview_date = 4;
}

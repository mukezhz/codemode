syntax = "proto3";

package fixture.v1;

import "codemode.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/mukezhz/codemode/registry/internal/fixturepb/gen/fixture/v1;fixturev1";

// Test fixture: one field of each shape the type renderer handles.
service OrderService {
  option (codemode.namespace) = "orders";
  option (codemode.default_permissions) = "orders.read";

  rpc List(ListOrdersRequest) returns (ListOrdersResponse) {
    option (codemode.description) = "Lists orders, newest first.";
  }

  rpc Get(GetOrderRequest) returns (OrderResponse) {
    option (codemode.description) = "Returns one order by ID.";
  }

  rpc Cancel(GetOrderRequest) returns (OrderResponse) {
    option (codemode.description) = "Cancels an order that has not shipped.";
    option (codemode.roles) = "support";
    option (codemode.permissions) = "orders.write";
  }
}

message Order {
  int64 id = 1;
  string reference = 2;
  bool shipped = 3;
  repeated string items = 4;
  map<string, string> labels = 5;
  bytes receipt = 6;
  Status status = 7;
  google.protobuf.Timestamp placed_at = 8 [(codemode.field_description) = "When the customer placed the order"];
  optional string note = 9;
  oneof destination {
    string address = 10;
    string pickup_point = 11;
  }
  google.protobuf.Int64Value parent_id = 12;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OPEN = 1;
  STATUS_SHIPPED = 2;
}

message ListOrdersRequest {}

message ListOrdersResponse {
  repeated Order orders = 1;
}

message GetOrderRequest {
  int64 id = 1;
}

message OrderResponse {
  Order order = 1;
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: codemode
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          unformatted=$(gofmt -l . | grep -v '^docs/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test pgvector backend
        env:
          CAPABILITY_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/codemode?sslmode=disable
        run: go test ./capability/pgstore -run TestPostgresSearch -count=1

  # The whole point of the driver split is that a consumer links only what it
  # asks for. These builds fail if an import creeps back into a core package.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: A minimal consumer links no third-party dependency
        run: ./scripts/check-consumer.sh

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - run: buf lint

      # A registry that no longer matches the protos is a silent failure: the
      # model is offered capabilities the host will reject.
      - name: Registry is up to date
        run: |
          buf build --as-file-descriptor-set -o registry/protoset.pb
          go run ./cmd/codemode-registry
          git diff --exit-code registry/registry.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs build
